<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job alerts | Skill2Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="nav"></div>
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display text-3xl sm:text-4xl font-bold text-ink"><span data-i18n="alerts.title">Job alerts</span><span class="type-cursor">_</span></h1>
        <p class="text-slate-600 mt-1 max-w-2xl" data-i18n="alerts.subtitle">Save a search once. When a new job that matches it is published, you get a notification and (if you want) an email digest. Alerts are checked every 15 minutes.</p>
      </div>
      <div class="flex gap-2">
        <button type="button" class="btn btn-ghost" id="runBtn">⚡ <span data-i18n="alerts.checkNow">Check now</span></button>
        <button type="button" class="btn btn-primary" id="newBtn">＋ <span data-i18n="alerts.new">New alert</span></button>
      </div>
    </div>

    <form id="alertForm" class="grad-card p-6 mt-6 hidden" novalidate>
      <h2 class="font-display text-lg font-bold text-ink" id="formTitle" data-i18n="alerts.new">New alert</h2>
      <div class="mt-4 grid sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2"><label class="label" for="name" data-i18n="alerts.name">Alert name</label>
          <input id="name" name="name" class="field" maxlength="60" required data-i18n-placeholder="alerts.namePh" placeholder="e.g. Java internships in Dhaka"></div>
        <div><label class="label" for="keyword" data-i18n="jobs.searchLabel">Search</label>
          <input id="keyword" name="keyword" class="field" maxlength="80" data-i18n-placeholder="jobs.searchPlaceholder" placeholder="Title, company or keyword"></div>
        <div><label class="label" for="type" data-i18n="jobs.typeLabel">Type</label>
          <select id="type" name="type" class="field">
            <option value="" data-i18n="jobs.typeAny">Any</option>
            <option value="INTERNSHIP" data-i18n="jobs.typeInternship">Internship</option>
            <option value="FULL_TIME" data-i18n="jobs.typeFullTime">Full-time</option>
            <option value="PART_TIME" data-i18n="jobs.typePartTime">Part-time</option>
          </select></div>
        <div><label class="label" for="location" data-i18n="common.location">Location</label>
          <input id="location" name="location" class="field" maxlength="80" data-i18n-placeholder="jobs.locationPlaceholder" placeholder="e.g. Dhaka"></div>
        <div><label class="label" for="skillId" data-i18n="jobs.skillLabel">Skill</label>
          <select id="skillId" name="skillId" class="field"><option value="" data-i18n="jobs.typeAny">Any</option></select></div>
        <div><label class="label" for="minMatch" data-i18n="alerts.minMatch">Minimum match % (optional)</label>
          <input id="minMatch" name="minMatch" class="field" type="number" min="0" max="100" placeholder="e.g. 60"></div>
        <div class="flex items-center gap-3 pt-6">
          <label class="switch"><input type="checkbox" id="emailEnabled" checked><span></span></label>
          <label for="emailEnabled" class="text-sm text-slate-700" data-i18n="alerts.email">Also send me an email</label>
        </div>
      </div>
      <p id="formError" class="hidden text-sm text-miss mt-3" role="alert"></p>
      <div class="mt-5 flex gap-2">
        <button type="submit" class="btn btn-primary" id="saveBtn" data-i18n="alerts.save">Save alert</button>
        <button type="button" class="btn btn-ghost" id="cancelBtn" data-i18n="common.cancel">Cancel</button>
      </div>
    </form>

    <div id="alerts" class="mt-6 grid gap-4"></div>
  </main>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/job-alerts.js"></script>
</body>
</html>
