<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Skill2Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="nav"></div>
  <main class="flex-1 flex items-start justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <h1 class="font-display text-3xl font-bold text-ink" data-i18n="nav.login">Log in</h1>
      <p id="notice" class="hidden mt-3 text-sm rounded-lg bg-amber-50 text-amber-800 px-3 py-2"></p>
      <form id="loginForm" class="panel p-6 mt-6 space-y-4" novalidate>
        <div>
          <label class="label" for="email" data-i18n="common.email">Email</label>
          <input class="field" id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div>
          <div class="flex items-center justify-between"><label class="label" for="password" data-i18n="common.password">Password</label>
            <a href="/forgot-password.html" class="text-sm text-brand-dark font-semibold mb-1" id="forgotLink" data-i18n="login.forgot">Forgot password?</a></div>
          <input class="field" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="error" class="hidden text-sm text-miss" role="alert"></p>
        <button class="btn btn-primary w-full" type="submit" id="submitBtn" data-i18n="nav.login">Log in</button>
        <p class="text-sm text-slate-600 text-center"><span data-i18n="login.noAccount">No account yet?</span> <a class="text-brand font-semibold" href="/register.html" data-i18n="nav.signup">Sign up</a></p>
      </form>

      <div class="panel p-5 mt-6">
        <h2 class="font-semibold text-ink" data-i18n="login.demoAccountsHeading">Demo accounts</h2>
        <p class="text-sm text-slate-500 mt-1"><span data-i18n="login.demoPasswordHint">Password for all demo users:</span> <code>Demo@123</code><span data-i18n="login.demoClickHint">. Click one to fill the form.</span></p>
        <div class="mt-3 flex flex-wrap gap-2" id="demoUsers"></div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
