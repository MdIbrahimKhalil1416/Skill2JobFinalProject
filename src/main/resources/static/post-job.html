<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post a job | Skill2Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="nav"></div>
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <a href="/employer.html" class="text-sm font-semibold text-brand" data-i18n="common.backToDashboard">Back to dashboard</a>
    <h1 class="font-display text-3xl font-bold text-ink mt-3" id="title" data-i18n="nav.postJob">Post a job</h1>

    <form id="jobForm" class="mt-6 space-y-6" novalidate>
      <section class="panel p-5 space-y-4">
        <div><label class="label" for="jobTitle" data-i18n="postJob.jobTitleLabel">Job title</label><input class="field" id="jobTitle" name="title" maxlength="120" required placeholder="e.g. Junior Java Developer" data-i18n-placeholder="postJob.jobTitlePlaceholder"></div>
        <div class="grid sm:grid-cols-3 gap-3">
          <div><label class="label" for="type" data-i18n="jobs.typeLabel">Type</label>
            <select class="field" id="type" name="type">
              <option value="INTERNSHIP" data-i18n="jobs.typeInternship">Internship</option><option value="FULL_TIME" data-i18n="jobs.typeFullTime">Full-time</option><option value="PART_TIME" data-i18n="jobs.typePartTime">Part-time</option>
            </select></div>
          <div><label class="label" for="location" data-i18n="common.location">Location</label><input class="field" id="location" name="location" maxlength="100" required placeholder="e.g. Dhaka or Remote" data-i18n-placeholder="postJob.locationPlaceholder"></div>
          <div><label class="label" for="deadline" data-i18n="postJob.deadlineLabel">Application deadline</label><input class="field" id="deadline" name="deadline" type="date" required></div>
        </div>
        <div><label class="label" for="description" data-i18n="postJob.descriptionLabel">Description</label><textarea class="field" id="description" name="description" rows="6" maxlength="4000" required placeholder="What will the person do? What do you offer?" data-i18n-placeholder="postJob.descriptionPlaceholder"></textarea></div>
      </section>

      <section class="panel p-5">
        <div class="flex items-center justify-between gap-3">
          <h2 class="font-display text-lg font-bold text-ink" data-i18n="postJob.requiredSkillsHeading">Required skills</h2>
          <button type="button" class="btn btn-ghost btn-sm" id="addRow" data-i18n="common.addSkill">Add skill</button>
        </div>
        <p class="text-sm text-slate-500 mt-1" data-i18n="postJob.skillsHint">Level: the minimum you expect (1-5). Importance: how much this skill counts in the match score (1-5). Required: students without it are marked not eligible.</p>
        <div class="mt-4 hidden sm:grid grid-cols-[2fr_1fr_1fr_auto_auto] gap-3 text-sm font-semibold text-slate-600 px-1">
          <span data-i18n="postJob.colSkill">Skill</span><span data-i18n="postJob.colMinLevel">Min level</span><span data-i18n="postJob.colImportance">Importance</span><span data-i18n="postJob.colRequired">Required</span><span class="w-[70px]"></span>
        </div>
        <div id="rows" class="mt-2 space-y-3"></div>
      </section>

      <p id="error" class="hidden text-miss font-semibold" role="alert"></p>
      <div class="flex gap-3">
        <button class="btn btn-primary" type="submit" id="saveBtn" data-i18n="postJob.publishBtn">Publish job</button>
        <a class="btn btn-ghost" href="/employer.html" data-i18n="common.cancel">Cancel</a>
      </div>
    </form>
  </main>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/post-job.js"></script>
</body>
</html>
