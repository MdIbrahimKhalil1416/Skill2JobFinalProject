<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password | Skill2Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="nav"></div>
  <main class="flex-1 flex items-start justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <h1 class="font-display text-3xl font-bold text-ink"><span data-i18n="fp.title">Reset your password</span><span class="type-cursor">_</span></h1>
      <p class="text-slate-600 mt-2" id="hint" data-i18n="fp.hint1">Enter your account email. We'll send you a 6-digit code.</p>

      <form id="emailForm" class="grad-card p-6 mt-6 space-y-4" novalidate>
        <div><label class="label" for="email" data-i18n="common.email">Email</label>
          <input class="field" id="email" type="email" autocomplete="username" required></div>
        <p id="err1" class="hidden text-sm text-miss" role="alert"></p>
        <button class="btn btn-primary w-full" type="submit" id="sendBtn" data-i18n="fp.send">Send code</button>
        <p class="text-sm text-slate-600 text-center"><a class="text-brand-dark font-semibold" href="/login.html" data-i18n="fp.back">Back to log in</a></p>
      </form>

      <form id="resetForm" class="grad-card p-6 mt-6 space-y-4 hidden" novalidate>
        <p id="sentTo" class="text-sm text-slate-600"></p>
        <div><label class="label" for="code" data-i18n="verifyOtp.codeLabel">Verification code</label>
          <input class="field text-center text-2xl tracking-[0.3em]" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="------"></div>
        <div><label class="label" for="pw1" data-i18n="fp.newPw">New password</label>
          <input class="field" id="pw1" type="password" autocomplete="new-password" minlength="6" maxlength="72"></div>
        <div><label class="label" for="pw2" data-i18n="fp.confirmPw">Confirm new password</label>
          <input class="field" id="pw2" type="password" autocomplete="new-password" minlength="6" maxlength="72"></div>
        <p id="err2" class="hidden text-sm text-miss" role="alert"></p>
        <button class="btn btn-primary w-full" type="submit" id="resetBtn" data-i18n="fp.reset">Set new password</button>
        <button class="btn btn-ghost w-full" type="button" id="resendBtn" data-i18n="verifyOtp.resendBtn">Resend code</button>
      </form>

      <div id="done" class="grad-card p-6 mt-6 text-center hidden">
        <div class="text-5xl">🔐</div>
        <p class="text-ink font-semibold mt-3" data-i18n="fp.done">Your password has been reset.</p>
        <a class="btn btn-primary mt-4" href="/login.html" data-i18n="nav.login">Log in</a>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/forgot-password.js"></script>
</body>
</html>
