<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify your email | Skill2Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="nav"></div>
  <main class="flex-1 flex items-start justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <h1 class="font-display text-3xl font-bold text-ink" data-i18n="verifyOtp.title">Verify your email</h1>
      <p class="text-slate-600 mt-2"><span data-i18n="verifyOtp.hintPrefix">We sent a 6-digit code to</span> <strong id="emailLabel">your email</strong><span data-i18n="verifyOtp.hintSuffix">. Enter it below to activate your account.</span></p>

      <form id="otpForm" class="panel p-6 mt-6 space-y-4" novalidate>
        <div>
          <label class="label" for="otp" data-i18n="verifyOtp.codeLabel">Verification code</label>
          <input class="field text-center text-2xl tracking-[0.3em]" id="otp" name="otp" inputmode="numeric"
                 autocomplete="one-time-code" maxlength="6" pattern="\d{6}" placeholder="------" required>
          <p id="expiryNote" class="text-xs text-slate-500 mt-1"></p>
        </div>
        <p id="error" class="hidden text-sm text-miss" role="alert"></p>
        <p id="info" class="hidden text-sm text-ink" role="status"></p>
        <button class="btn btn-primary w-full" type="submit" id="verifyBtn" data-i18n="verifyOtp.verifyBtn">Verify</button>
        <button class="btn btn-ghost w-full" type="button" id="resendBtn" data-i18n="verifyOtp.resendBtn">Resend code</button>
        <p class="text-sm text-slate-600 text-center"><span data-i18n="verifyOtp.wrongEmail">Wrong email?</span> <a class="text-brand font-semibold" href="/register.html" data-i18n="verifyOtp.signUpAgain">Sign up again</a></p>
      </form>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/verify-otp.js"></script>
</body>
</html>
