<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning roadmap | Skill2Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="min-h-screen flex flex-col">
  <div id="nav"></div>
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8 print-area">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display text-3xl sm:text-4xl font-bold text-ink"><span data-i18n="roadmap.title">Learning roadmap</span><span class="type-cursor">_</span></h1>
        <p class="text-slate-600 mt-1 max-w-2xl" data-i18n="roadmap.subtitle">A week-by-week plan built from your exact skill gaps: the right courses in the right order, with a skill test at the end of each skill.</p>
      </div>
      <button type="button" class="btn btn-ghost no-print" id="pdfBtn" disabled>📄 <span data-i18n="roadmap.print">Save PDF</span></button>
    </div>

    <form id="controls" class="grad-card p-5 mt-6 grid md:grid-cols-[2fr_1.3fr_auto] gap-4 items-end no-print" novalidate>
      <div>
        <label class="label" for="target" data-i18n="roadmap.target">Target</label>
        <select id="target" class="field"><option value="" data-i18n="roadmap.market">The skills most open jobs ask for</option></select>
      </div>
      <div>
        <label class="label" for="hours"><span data-i18n="roadmap.hours">Hours per week</span>: <span id="hoursVal" class="text-ink">8</span></label>
        <input id="hours" type="range" min="2" max="30" step="1" value="8" class="w-full accent-fuchsia-500">
      </div>
      <button type="submit" class="btn btn-primary" id="genBtn" data-i18n="roadmap.generate">Generate</button>
    </form>

    <div id="roadmapContainer">
      <div id="summary" class="mt-6"></div>
      <div id="weeks" class="mt-6 relative"></div>
    </div>
  </main>
  <!-- Light, print-friendly copy of the roadmap; filled by roadmap.js and exported to PDF -->
  <div id="pdfSheet" class="rm-paper" aria-hidden="true"></div>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/roadmap.js"></script>
</body>
</html>
