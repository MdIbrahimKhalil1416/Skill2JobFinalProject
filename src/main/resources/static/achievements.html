<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Achievements | Skill2Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="nav"></div>
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display text-3xl sm:text-4xl font-bold text-ink"><span data-i18n="ach.title">Achievements</span><span class="type-cursor">_</span></h1>
        <p class="text-slate-600 mt-1 max-w-2xl" data-i18n="ach.subtitle">Earn XP for learning - skill tests, courses, mock interviews and applying. Keep a daily streak and collect badges.</p>
      </div>
      <a href="/leaderboard.html" class="btn btn-primary">🏆 <span data-i18n="nav.leaderboard">Leaderboard</span></a>
    </div>
    <div id="top" class="mt-6 grid lg:grid-cols-3 gap-5"></div>
    <div class="mt-6 grid lg:grid-cols-[1.3fr_1fr] gap-6">
      <section class="panel p-5">
        <h2 class="font-display text-lg font-bold text-ink" data-i18n="ach.badges">Badges</h2>
        <div id="badges" class="mt-4 grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
      </section>
      <div class="space-y-6">
        <section class="panel p-5">
          <h2 class="font-display text-lg font-bold text-ink" data-i18n="ach.checklist">Complete your profile</h2>
          <ul id="checklist" class="mt-3 space-y-2"></ul>
        </section>
        <section class="panel p-5">
          <h2 class="font-display text-lg font-bold text-ink" data-i18n="ach.activity">Last 5 weeks</h2>
          <div id="heatmap" class="mt-3"></div>
        </section>
        <section class="panel p-5">
          <h2 class="font-display text-lg font-bold text-ink" data-i18n="ach.recent">Recent XP</h2>
          <ul id="recent" class="mt-3 divide-y divide-slate-100"></ul>
        </section>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/achievements.js"></script>
</body>
</html>
