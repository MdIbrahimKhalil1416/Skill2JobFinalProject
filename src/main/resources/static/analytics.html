<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiring analytics | Skill2Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="min-h-screen flex flex-col">
  <div id="nav"></div>
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display text-3xl sm:text-4xl font-bold text-ink"><span data-i18n="an.title">Hiring analytics</span><span class="type-cursor">_</span></h1>
        <p class="text-slate-600 mt-1 max-w-2xl" data-i18n="an.subtitle">Your hiring funnel, time to hire, who applies and which skills they are missing.</p>
      </div>
      <form id="filters" class="flex flex-wrap items-end gap-3" novalidate>
        <div><label class="label" for="job" data-i18n="an.job">Job</label>
          <select id="job" class="field min-w-[220px]"><option value="" data-i18n="an.allJobs">All my jobs</option></select></div>
        <div><label class="label" for="weeks" data-i18n="an.period">Period</label>
          <select id="weeks" class="field"><option value="8">8 weeks</option><option value="12" selected>12 weeks</option><option value="26">26 weeks</option></select></div>
        <button type="button" class="btn btn-ghost" id="csvBtn">⬇️ CSV</button>
      </form>
    </div>

    <div id="kpis" class="mt-6 grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

    <div class="mt-6 grid lg:grid-cols-2 gap-6">
      <section class="panel p-5"><h2 class="font-display text-lg font-bold text-ink" data-i18n="an.funnel">Hiring funnel</h2><div id="funnel" class="mt-4 space-y-3"></div></section>
      <section class="panel p-5"><h2 class="font-display text-lg font-bold text-ink" data-i18n="an.overTime">Applications per week</h2><div class="mt-4 h-64"><canvas id="weekChart"></canvas></div></section>
      <section class="panel p-5"><h2 class="font-display text-lg font-bold text-ink" data-i18n="an.topSkills">Top skills of your applicants</h2><div class="mt-4 h-72"><canvas id="skillsChart"></canvas></div></section>
      <section class="panel p-5"><h2 class="font-display text-lg font-bold text-ink" data-i18n="an.gaps">Required skills applicants most often lack</h2><div class="mt-4 h-72"><canvas id="gapChart"></canvas></div></section>
      <section class="panel p-5"><h2 class="font-display text-lg font-bold text-ink" data-i18n="an.matchDist">Match % of applicants</h2><div class="mt-4 h-64"><canvas id="matchChart"></canvas></div></section>
      <section class="panel p-5"><h2 class="font-display text-lg font-bold text-ink" data-i18n="an.status">Applications by status &amp; department</h2>
        <div class="mt-4 grid sm:grid-cols-2 gap-4 items-center"><div class="h-56"><canvas id="statusChart"></canvas></div><ul id="departments" class="space-y-2 text-sm"></ul></div></section>
    </div>

    <section class="panel mt-6 overflow-x-auto">
      <div class="p-5 pb-0"><h2 class="font-display text-lg font-bold text-ink" data-i18n="an.perJob">Per job</h2></div>
      <div id="jobsTable" class="mt-3"></div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/analytics.js"></script>
</body>
</html>
