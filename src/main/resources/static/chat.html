<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat | Skill2Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="nav"></div>
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8">
    <h1 class="font-display text-2xl font-bold text-ink" id="title" data-i18n="chat.title">Chat</h1>
    <p class="text-slate-500 text-sm mt-1" data-i18n="chat.hint">Chat opens once an application is shortlisted.</p>
    <div id="thread" class="panel mt-6 p-4 min-h-[300px] max-h-[55vh] overflow-y-auto flex flex-col gap-3"></div>
    <form id="sendForm" class="mt-4 flex gap-2" novalidate>
      <input class="field flex-1" id="text" name="text" maxlength="2000" placeholder="Type a message..." autocomplete="off" data-i18n-placeholder="chat.placeholder">
      <button class="btn btn-primary" type="submit" data-i18n="common.send">Send</button>
    </form>
  </main>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/chat.js"></script>
</body>
</html>
