<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV builder | Skill2Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="min-h-screen flex flex-col">
  <div id="nav"></div>
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 print-area">
    <div class="flex flex-wrap items-end justify-between gap-4 no-print">
      <div>
        <h1 class="font-display text-3xl sm:text-4xl font-bold text-ink"><span data-i18n="cv.title">CV builder</span><span class="type-cursor">_</span></h1>
        <p class="text-slate-600 mt-1 max-w-2xl" data-i18n="cv.subtitle">Your profile, skills (with verified levels) and completed courses are filled in automatically. Add projects, experience and education, pick a template and download a PDF.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="btn btn-ghost" id="saveBtn">💾 <span data-i18n="cv.save">Save</span></button>
        <button type="button" class="btn btn-primary" id="pdfBtn">⬇️ <span data-i18n="cv.download">Download PDF</span></button>
      </div>
    </div>

    <div class="mt-6 grid xl:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)] gap-6 items-start">
      <form id="editor" class="space-y-4 no-print" novalidate>
        <section class="panel p-5">
          <div class="flex items-center justify-between gap-3">
            <h2 class="font-display text-lg font-bold text-ink" data-i18n="cv.basics">Basics</h2>
            <a href="/profile.html" class="text-sm text-brand-dark font-semibold" data-i18n="cv.editProfile">Edit name, bio, links</a>
          </div>
          <div class="mt-4 grid sm:grid-cols-2 gap-3">
            <div class="sm:col-span-2"><label class="label" for="headline" data-i18n="cv.headline">Headline</label>
              <input id="headline" class="field" maxlength="120" data-bind="headline" data-i18n-placeholder="cv.headlinePh" placeholder="e.g. Aspiring Java backend developer"></div>
            <div><label class="label" for="phone" data-i18n="cv.phone">Phone</label>
              <input id="phone" class="field" maxlength="30" data-bind="phone" placeholder="+8801..."></div>
            <div><label class="label" for="city" data-i18n="cv.city">City</label>
              <input id="city" class="field" maxlength="80" data-bind="city" placeholder="Dhaka"></div>
            <div><label class="label" for="template" data-i18n="cv.template">Template</label>
              <select id="template" class="field" data-bind="template">
                <option value="modern" data-i18n="cv.tModern">Modern (sidebar)</option>
                <option value="classic" data-i18n="cv.tClassic">Classic</option>
                <option value="minimal" data-i18n="cv.tMinimal">Minimal</option>
              </select></div>
            <div><label class="label" for="languages" data-i18n="cv.languages">Languages (comma separated)</label>
              <input id="languages" class="field" maxlength="250" placeholder="Bangla, English"></div>
          </div>
        </section>
        <section class="panel p-5" data-section="projects"></section>
        <section class="panel p-5" data-section="experiences"></section>
        <section class="panel p-5" data-section="education"></section>
        <section class="panel p-5" data-section="certifications"></section>
        <p id="formError" class="hidden text-sm text-miss" role="alert"></p>
      </form>

      <div class="xl:sticky xl:top-20">
        <div class="overflow-auto rounded-xl"><div id="cvPaper" class="cv-paper"></div></div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pages/cv-builder.js"></script>
</body>
</html>
