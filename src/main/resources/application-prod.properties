# Production profile (Render). Secure by default: ProductionConfigGuard refuses to start on an unsafe setup.
logging.level.com.skill2job=INFO
logging.level.org.mongodb.driver=WARN
# Never write secrets or one-time codes to the logs.
app.seed.print-credentials=false
app.otp.log-to-console=false
# Demo data is off in production; SEED_ENABLED alone cannot turn it on (it also needs SEED_ALLOW_IN_PROD=true).
app.seed.enabled=${SEED_ENABLED:false}
