# Development profile (the default when SPRING_PROFILES_ACTIVE is not set)
logging.level.com.skill2job=DEBUG
app.seed.print-credentials=true

# Local conveniences. Each can still be overridden with the usual environment variable / .env entry, and NONE of
# them exists in the base or prod configuration - production must provide its own.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
app.admin.email=${ADMIN_EMAIL:admin@skill2job.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed.enabled=${SEED_ENABLED:true}
# Lets you test signup/OTP locally without configuring real SMTP credentials.
app.otp.log-to-console=${OTP_LOG_TO_CONSOLE:true}
