spring.application.name=skill2job

# Optional local settings file: put MONGODB_URI=... in a file named ".env" in the project root.
# It is git-ignored, so your password never ends up on GitHub.
spring.config.import=optional:file:.env[.properties]

# Render gives the port in the PORT env var; locally it falls back to 8080
server.port=${PORT:8090}

# Active profile: dev locally, set SPRING_PROFILES_ACTIVE=prod on Render
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MongoDB (local default, Atlas URI comes from env var on Render)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/skill2job}
spring.data.mongodb.auto-index-creation=true

# JWT (the secret must be at least 32 characters). NO default here on purpose: the dev profile supplies a
# development-only one (application-dev.properties); production must set JWT_SECRET or it refuses to start.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Admin account created on startup if it does not exist. No default here: the dev profile supplies a local one;
# production needs an explicit, strong ADMIN_EMAIL / ADMIN_PASSWORD. An existing account is never modified.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:System Admin}

# Demo data (skills, jobs, courses, demo users) when the database is empty. OFF unless a profile or SEED_ENABLED
# turns it on (dev does). Production additionally ignores it unless SEED_ALLOW_IN_PROD=true.
app.seed.enabled=${SEED_ENABLED:false}
app.seed.allow-in-prod=${SEED_ALLOW_IN_PROD:false}
# Skill-test / mock-interview question banks (product content, loaded only into an empty collection)
app.seed.question-banks=${SEED_QUESTION_BANKS:true}

# Email. Chosen automatically:
#  - BREVO_API_KEY set  -> Brevo HTTPS API (use this on Render: its free web services block SMTP ports).
#  - otherwise          -> SMTP with MAIL_USERNAME / MAIL_PASSWORD (local development; Gmail needs a 16-character app password).
# The sender is MAIL_FROM (default: MAIL_USERNAME); with Brevo it must be a sender verified in the Brevo dashboard.
# Never hardcode any of these values.
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.from-name=${MAIL_FROM_NAME:Skill2Job}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@skill2job.com}}

# Signup OTP behaviour
# Email verification (signup OTP). Off by default: new accounts are active right away and no email provider is needed.
# Set EMAIL_VERIFICATION_ENABLED=true (plus BREVO_API_KEY or SMTP) to require the emailed 6-digit code again.
app.auth.email-verification=${EMAIL_VERIFICATION_ENABLED:false}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
# Dev convenience only (switched on by application-dev.properties): also prints the OTP to the server log.
# Always false in production, which also refuses to start if it were true.
app.otp.log-to-console=${OTP_LOG_TO_CONSOLE:false}

# CV upload (signup). CV_UPLOAD_DIR can point anywhere writable; it is created automatically.
app.cv.upload-dir=${CV_UPLOAD_DIR:./uploads/cv}
app.cv.max-size-mb=${CV_MAX_SIZE_MB:5}
spring.servlet.multipart.max-file-size=${CV_MAX_SIZE_MB:5}MB
spring.servlet.multipart.max-request-size=15MB

# Company logo upload (company branding feature). LOGO_UPLOAD_DIR can point anywhere writable.
app.logo.upload-dir=${LOGO_UPLOAD_DIR:./uploads/logos}
app.logo.max-size-mb=${LOGO_MAX_SIZE_MB:2}

# Daily sweep of orphaned upload files (no profile references them) and leftover temp files. Only files older
# than min-age-hours are touched, so an upload in progress is safe.
app.storage.cleanup.enabled=${STORAGE_CLEANUP_ENABLED:true}
app.storage.cleanup.min-age-hours=${STORAGE_CLEANUP_MIN_AGE_HOURS:24}

# Payments (SSLCommerz) - employer job-posting fee + Pro subscription. SANDBOX by default and never switched to
# live automatically; live mode (SSLCOMMERZ_SANDBOX=false) in production needs your own store id/password and an
# https APP_BASE_URL, otherwise the app refuses to start. testbox/qwerty are SSLCommerz's public sandbox values.
# Base URL SSLCommerz redirects back to; must be reachable by the customer's browser (localhost is
# fine for the success/fail/cancel redirect flow). ipn-url additionally needs a PUBLIC URL - it won't
# be reached on localhost, but the redirect flow above still works without it.
app.payment.base-url=${APP_BASE_URL:http://localhost:8080}
app.payment.sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:testbox}
app.payment.sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:qwerty}
app.payment.sslcommerz.sandbox=${SSLCOMMERZ_SANDBOX:true}
# Employers get this many free lifetime job posts before a posting fee applies (BDT).
app.payment.free-job-posts=${FREE_JOB_POSTS:2}
app.payment.job-post-fee=${JOB_POST_FEE:500}
# Pro subscription: removes the per-job posting fee while active (BDT / days).
app.payment.subscription-price=${SUBSCRIPTION_PRICE:2000}
app.payment.subscription-days=${SUBSCRIPTION_DAYS:30}
# Student Pro (students pay once per period; renewals extend the current expiry)
app.payment.student-pro-price=${STUDENT_PRO_PRICE:299}
app.payment.student-pro-days=${STUDENT_PRO_DAYS:30}
# Payment recovery: how often confirmed-but-not-activated payments and deferred gateway validations are retried.
app.payment.recovery-interval-ms=${PAYMENT_RECOVERY_INTERVAL_MS:300000}

# Public base URL of this app (links inside emails, e.g. job-alert digests)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Skill tests (MCQ skill verification)
app.quiz.questions-per-test=${QUIZ_QUESTIONS_PER_TEST:5}
app.quiz.time-limit-minutes=${QUIZ_TIME_LIMIT_MINUTES:10}
# Wait time before the same skill test can be retaken (counted from the start of the last attempt)
app.quiz.cooldown-minutes=${QUIZ_COOLDOWN_MINUTES:30}

# Job alerts: how often saved searches are checked for newly published jobs (Spring cron, Asia/Dhaka)
app.alerts.cron=${JOB_ALERTS_CRON:0 */15 * * * *}

# Rate limits on the public auth endpoints (register/login/OTP/resend/forgot/reset), per application instance.
# CLIENT_IP_HOPS = how many reverse proxies sit in front of the app (Render = 1): the real client IP is then the
# entry that proxy appended to X-Forwarded-For. Set 0 to ignore the header (direct connections only).
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.client-ip-hops=${CLIENT_IP_HOPS:1}

# Forgot-password codes (resend cooldown and max attempts reuse the app.otp.* settings above)
app.password-reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:15}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator: only expose health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Return clean error JSON without stack traces
server.error.include-stacktrace=never
server.error.include-message=always
